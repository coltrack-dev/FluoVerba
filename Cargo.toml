[package]
name = "fluoverba"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Lightweight bilingual desktop ticker"

[lib]
name = "fluoverba"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
# A/B diagnostic build: keep slider event delivery/logging enabled but skip
# applying the slider's speed value to the animation state.
disable-speed-handler = []
minimal-settings-close = []

[[bin]]
name = "fluoverba"
path = "src/main.rs"

[dependencies]
slint = { version = "=1.18.1", features = ["backend-android-activity-06"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = "=0.6.1"
jni = "=0.22.4"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.android]
package = "org.fluoverba.ticker"
build_targets = ["aarch64-linux-android"]
assets = "android/assets"
apk_name = "fluoverba"
java_sources = "android/java"
manifest_override = "android/AndroidManifest.xml"

[[package.metadata.android.queries.intent]]
actions = ["android.intent.action.TTS_SERVICE"]

[package.metadata.android.application]
label = "FluoVerba"

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
exported = true
config_changes = "orientation|keyboardHidden|screenSize"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "fluoverba"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[package.metadata.android.sdk]
min_sdk_version = 26
