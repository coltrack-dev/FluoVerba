[package]
name = "fluoverba"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Lightweight bilingual desktop ticker"

[dependencies]
slint = "=1.18.1"
rusqlite = { version = "=0.32.1", features = ["bundled"] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
